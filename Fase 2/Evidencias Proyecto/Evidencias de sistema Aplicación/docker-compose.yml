services:
  db:
    image: postgres:15-alpine
    container_name: postgres_emergen_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Configura DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Configura DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - emergen_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - emergen_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_emergen_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
      - HOST=0.0.0.0
      - EMERGEN_ENVIRONMENT=${EMERGEN_ENVIRONMENT:-development}
      - EMERGEN_DEPLOYMENT_ID=${EMERGEN_DEPLOYMENT_ID:-docker}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      - JWT_SESSION_HOURS=${JWT_SESSION_HOURS:-2}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MEDICAL_DATA_KEYS=${MEDICAL_DATA_KEYS:-}
      # Integraciones externas (ver readme-apis.md)
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_SECRET=${PAYPAL_SECRET:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - MINDICADOR_API_URL=${MINDICADOR_API_URL:-https://mindicador.cl/api}
      # Opcional: CLP por USD para cobrar en PayPal si mindicador no responde.
      - DOLAR_CLP_RESPALDO=${DOLAR_CLP_RESPALDO:-}
      # Dentro del contenedor "localhost" es el propio contenedor: jsReport corre en el PC.
      - JSREPORT_URL=${JSREPORT_URL_DOCKER:-http://host.docker.internal:5488}
      - JSREPORT_USERNAME=${JSREPORT_USERNAME:-}
      - JSREPORT_PASSWORD=${JSREPORT_PASSWORD:-}
      # WhatsApp (Baileys): la sesión persiste en el volumen emergen_whatsapp_auth
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-false}
      - WHATSAPP_DEFAULT_COUNTRY_CODE=${WHATSAPP_DEFAULT_COUNTRY_CODE:-56}
      - WHATSAPP_SENDER_PHONE=${WHATSAPP_SENDER_PHONE:-}
      - WHATSAPP_AUTH_DIR=/app/apps/backend/auth_info_baileys
    volumes:
      - emergen_whatsapp_auth:/app/apps/backend/auth_info_baileys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # PC:contenedor. Dentro del contenedor la API escucha en 3000 (PORT, arriba); en el PC se
    # publica en 3001 para no chocar con el backend local (npm run start:dev, puerto 3000).
    # Los frontends lo consumen con el modo docker de Vite (.env.docker -> localhost:3001).
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - emergen_network

  internal-api:
    build:
      context: ./services/internal-api
    container_name: fastapi_emergen_internal
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Configura DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Configura DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET compartido por ambas APIs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,https://localhost}
      EMERGEN_ENVIRONMENT: ${EMERGEN_ENVIRONMENT:-development}
      EMERGEN_DEPLOYMENT_ID: ${EMERGEN_DEPLOYMENT_ID:-docker}
      INTERNAL_API_DOCS_ENABLED: ${INTERNAL_API_DOCS_ENABLED:-true}
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    networks:
      - emergen_network

volumes:
  emergen_postgres_data:
    name: volumen_emergen_postgres_data
  emergen_whatsapp_auth:
    name: volumen_emergen_whatsapp_auth
networks:
  emergen_network:
    driver: bridge
