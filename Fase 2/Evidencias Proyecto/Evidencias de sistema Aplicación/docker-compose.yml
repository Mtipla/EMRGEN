
services:
  db:
    image: postgres:15-alpine
    container_name: postgres_emergen_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - emergen_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - emergen_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_emergen_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Integraciones externas (ver readme-apis.md)
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_SECRET=${PAYPAL_SECRET:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_VALIDATION_API_KEY=${SENDGRID_VALIDATION_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Dentro del contenedor "localhost" es el propio contenedor: jsReport corre en el PC.
      - JSREPORT_URL=${JSREPORT_URL_DOCKER:-http://host.docker.internal:5488}
      - JSREPORT_USERNAME=${JSREPORT_USERNAME:-}
      - JSREPORT_PASSWORD=${JSREPORT_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    depends_on:
      - db
    networks:
      - emergen_network

volumes:
  emergen_postgres_data:
    name: volumen_emergen_postgres_data
networks:
  emergen_network:
    driver: bridge