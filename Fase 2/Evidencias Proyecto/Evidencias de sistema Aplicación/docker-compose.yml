version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_emergen_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - emergen_postgres_data:/var/lib/postgresql/data
    networks:
      - emergen_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_emergen_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - emergen_network

volumes:
  emergen_postgres_data:

networks:
  emergen_network:
    driver: bridge